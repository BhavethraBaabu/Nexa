# Local development: human-readable logs, verbose app logging.
logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    com.nexa: DEBUG
    org.flywaydb: INFO

nexa:
  auth:
    # Development-only key. Production must set JWT_SECRET (startup fails if it is missing).
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:false}
  integrations:
    # Development-only key. Production must set INTEGRATION_ENCRYPTION_KEY (openssl rand -base64 32).
    encryption-key: ${INTEGRATION_ENCRYPTION_KEY:bG9jYWwtZGV2LW9ubHkta2V5LWNoYW5nZS1tZS0zMiE=}
  mail:
    # Print password-reset and invitation links to the console, since email delivery is not set up yet.
    log-links: true
