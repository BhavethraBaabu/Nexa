spring:
  application:
    name: nexa
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexa}
    username: ${DATABASE_USERNAME:nexa}
    password: ${DATABASE_PASSWORD:nexa}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Nexa
    description: Where meetings become momentum.

nexa:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:nexa}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    password-reset-ttl: 30m
    invitation-ttl: 7d
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    refresh-cookie:
      name: nexa_refresh
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Strict
      path: /api/v1/auth
  mail:
    log-links: false

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
