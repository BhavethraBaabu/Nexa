spring:
  application:
    name: nexa
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexa}
    username: ${DATABASE_USERNAME:nexa}
    password: ${DATABASE_PASSWORD:nexa}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Nexa
    description: Where meetings become momentum.

nexa:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:nexa}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    password-reset-ttl: 30m
    invitation-ttl: 7d
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    refresh-cookie:
      name: nexa_refresh
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Strict
      path: /api/v1/auth
  mail:
    log-links: false
  ai:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.anthropic.com}
    model: ${LLM_MODEL:claude-opus-5-5}
    # medium keeps typical analyses near the PRD's 10-second target; raise for harder transcripts.
    effort: ${LLM_EFFORT:medium}
    max-output-tokens: 16000
    timeout: 120s
    max-transcript-chars: 300000
    stale-after: 15m

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
