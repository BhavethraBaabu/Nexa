spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/nexa_test}
    username: ${DATABASE_USERNAME:nexa}
    password: ${DATABASE_PASSWORD:nexa}
  flyway:
    clean-disabled: false

nexa:
  auth:
    jwt-secret: test-only-secret-0123456789abcdef0123456789
    refresh-cookie:
      secure: false
  ai:
    # Tests use a scripted fake LLM; no network calls are made.
    api-key: test-key-not-used
    run-inline: true
  actions:
    scheduler-enabled: false
  integrations:
    encryption-key: dGVzdC1vbmx5LWVuY3J5cHRpb24ta2V5LTMyYnl0ZXM=
    # Stand-in OAuth apps; base URLs are pointed at local stubs by the tests.
    jira:
      client-id: test-jira-client
      client-secret: test-jira-secret
    slack:
      client-id: test-slack-client
      client-secret: test-slack-secret

logging:
  structured:
    format:
      console: ""
  level:
    root: WARN
    com.nexa: INFO
